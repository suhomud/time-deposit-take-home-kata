services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: time_deposits
      POSTGRES_USER: time_deposit
      POSTGRES_PASSWORD: time_deposit

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposit -d time_deposits"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/time_deposits
      SPRING_DATASOURCE_USERNAME: time_deposit
      SPRING_DATASOURCE_PASSWORD: time_deposit

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: